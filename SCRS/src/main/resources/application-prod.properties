# Production profile for Render/Railway
spring.thymeleaf.cache=true
server.forward-headers-strategy=native

# Keep seed/demo data disabled in production
ccrs.dev.create-authority=false
ccrs.dev.seed-sample-academics=false
ccrs.dev.seed-demo-faculty=false

# Enable email OTP flow in production
ccrs.otp.send-email=${CCRS_OTP_SEND_EMAIL:true}
ccrs.otp.send-sms=${CCRS_OTP_SEND_SMS:false}
ccrs.sms.provider=${CCRS_SMS_PROVIDER:mock}
