# Sets the Spring Boot application name (used in logs and context).
spring.application.name=CCRS
# Default active Spring profile when none is specified.
spring.profiles.default=local

# Silence "manually instantiated DaoAuthenticationProvider" warning (our config is intentional)
# Silence a specific Spring Security warning by lowering its log level.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Server
# HTTP port the embedded server listens on (defaults to 8082 here).
server.port=${PORT:8082}
# Base URL path for the whole application.
server.servlet.context-path=/
# Disables the default Spring Boot error page.
server.error.whitelabel.enabled=false

# Thymeleaf
# Disable template caching for faster development feedback.
spring.thymeleaf.cache=false
# Location of Thymeleaf templates on the classpath.
spring.thymeleaf.prefix=classpath:/templates/
# File extension for Thymeleaf templates.
spring.thymeleaf.suffix=.html
# Template parsing mode (HTML is standard for web pages).
spring.thymeleaf.mode=HTML
# Character encoding for rendering templates.
spring.thymeleaf.encoding=UTF-8

# JPA / Hibernate
# Controls how Hibernate updates the database schema.
spring.jpa.hibernate.ddl-auto=update
# Whether to print SQL queries to the console.
spring.jpa.show-sql=false
# Formats SQL logs to be easier to read.
spring.jpa.properties.hibernate.format_sql=true

# MySQL - short timeouts so the app does not hang if MySQL is off
# JDBC URL for the database connection (with local defaults).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ccrs_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=5000}
# Database username (can be overridden by env var).
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Database password (empty by default for local dev).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# JDBC driver class name for MySQL.
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Dev seed users for authority login (admin/director/faculty/staff)
# Whether to create seed authority users on startup.
ccrs.dev.create-authority=false
# Whether to seed sample academic data in dev.
ccrs.dev.seed-sample-academics=false
# Whether to seed demo faculty data in dev.
ccrs.dev.seed-demo-faculty=false

# OTP: true = send email; false = log OTP and show on verify page (dev). Configure spring.mail below for real emails.
# When true, send OTP via email; when false, show/log OTP for dev.
ccrs.otp.send-email=true
# SMS: true = attempt real SMS via Twilio; false = dummy log only (dev).
# When true, send OTP via SMS; when false, log only (dev).
ccrs.otp.send-sms=false
# SMS provider selection: "mock" (default) or "twilio".
# SMS provider selection (mock or twilio).
ccrs.sms.provider=mock
# Mock provider output file (used when provider=mock)
# File path for mock SMS output.
ccrs.sms.mock-file=logs/sms-otp.log

# Razorpay payment gateway (demo/live as per keys)
# Payment provider selection (mock or razorpay).
ccrs.payment.provider=mock
# Enables Razorpay integration when true.
ccrs.payment.razorpay.enabled=false
# Base URL for Razorpay API calls.
ccrs.payment.razorpay.base-url=https://api.razorpay.com
# Razorpay API key id (from dashboard).
ccrs.payment.razorpay.key-id=
# Razorpay API key secret (from dashboard).
ccrs.payment.razorpay.key-secret=
# Company name shown on Razorpay payment pages.
ccrs.payment.razorpay.company-name=CCRS College

# Mail - SMTP
# SMTP host for outgoing emails.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
# SMTP port for outgoing emails.
spring.mail.port=${SPRING_MAIL_PORT:587}
# SMTP username (often an email address).
spring.mail.username=${SPRING_MAIL_USERNAME:}
# SMTP password or app password.
spring.mail.password=${SPRING_MAIL_PASSWORD:}
# Connection timeout for SMTP (ms).
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:10000}
# Read timeout for SMTP (ms).
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:10000}
# Write timeout for SMTP (ms).
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:10000}
# Enables SMTP authentication.
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
# Enables STARTTLS encryption for SMTP.
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
# Trust settings for SMTP SSL certificates.
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:*}

# Twilio SMS configuration (use env vars; leave blank for now)
# Twilio account SID for SMS sending.
twilio.account-sid=
# Twilio auth token for SMS sending.
twilio.auth-token=
# Twilio phone number used as sender.
twilio.from-number=

# File upload limits (set unlimited at server layer; controller validates per-file rules)
# Enables multipart file upload handling.
spring.servlet.multipart.enabled=true
# Max allowed size for a single uploaded file.
spring.servlet.multipart.max-file-size=-1
# Max allowed size for a full multipart request.
spring.servlet.multipart.max-request-size=-1
# Max size for form POST data handled by Tomcat.
server.tomcat.max-http-form-post-size=-1
# Max size Tomcat will swallow for large requests.
server.tomcat.max-swallow-size=-1
# Max number of parts in a multipart request.
server.tomcat.max-part-count=-1
# Max number of request parameters allowed.
server.tomcat.max-parameter-count=-1

# Upload directories (override for cloud deployments)
# Base directory for uploaded files.
ccrs.upload.base-dir=${CCRS_UPLOAD_BASE_DIR:uploads}
# Directory for uploaded document files.
ccrs.upload.documents-dir=${CCRS_UPLOAD_DOCUMENTS_DIR:${ccrs.upload.base-dir}/documents}
# Directory for uploaded teaching schema files.
ccrs.upload.teaching-schema-dir=${CCRS_UPLOAD_TEACHING_SCHEMA_DIR:${ccrs.upload.base-dir}/teaching-schemas}
