spring.application.name=CCRS

# Silence "manually instantiated DaoAuthenticationProvider" warning (our config is intentional)
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Server
server.port=8081
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MySQL – short timeouts so the app doesn't hang if MySQL is off
spring.datasource.url=jdbc:mysql://localhost:3306/ccrs_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=5000
spring.datasource.username=root
spring.datasource.password=K@7th1n4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dev seed users for authority login (admin/director/faculty/staff)
ccrs.dev.create-authority=false
ccrs.dev.seed-sample-academics=false
ccrs.dev.seed-demo-faculty=false

# OTP: true = send email; false = log OTP and show on verify page (dev). Configure spring.mail below for real emails.
ccrs.otp.send-email=true
# SMS: true = attempt real SMS via Twilio; false = dummy log only (dev).
ccrs.otp.send-sms=false
# SMS provider selection: "mock" (default) or "twilio".
ccrs.sms.provider=mock
# Mock provider output file (used when provider=mock)
ccrs.sms.mock-file=logs/sms-otp.log

# Razorpay payment gateway (demo/live as per keys)
ccrs.payment.provider=mock
ccrs.payment.razorpay.enabled=false
ccrs.payment.razorpay.base-url=https://api.razorpay.com
ccrs.payment.razorpay.key-id=
ccrs.payment.razorpay.key-secret=
ccrs.payment.razorpay.company-name=CCRS College

# Mail – Gmail SMTP using app password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kathanbhavsar273@gmail.com
spring.mail.password=ajzl iszk yroy xoqs
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio SMS configuration (use env vars; leave blank for now)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# File upload limits (set unlimited at server layer; controller validates per-file rules)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
server.tomcat.max-part-count=-1
server.tomcat.max-parameter-count=-1
