<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Fee Structure Form - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="role-staff">
<header class="dashboard-header">
<h1>Fee Structure Form</h1>
<nav class="dashboard-nav"><a class="nav-link active" th:href="@{/staff/fee-structures}">Back</a></nav>
</header>
<div class="dashboard-layout">
<main class="dashboard-main">
<section class="dashboard-section">
<form method="post" th:action="${fee.id == null} ? @{/staff/fee-structures} : @{/staff/fee-structures/{id}(id=${fee.id})}">
<div class="form-row">
<div class="form-group"><label class="required">Name</label><input name="name" required="" th:value="${fee.name}" type="text"/></div>
<div class="form-group"><label class="required">Effective From</label><input name="effectiveFrom" required="" th:value="${fee.effectiveFrom}" type="date"/></div>
</div>
<div class="form-row">
<div class="form-group"><label class="required">Cost Per Credit</label><input min="0" name="costPerCredit" required="" step="0.01" th:value="${fee.costPerCredit}" type="number"/></div>
<div class="form-group"><label class="required">Lab Fee</label><input min="0" name="labFee" required="" step="0.01" th:value="${fee.labFee}" type="number"/></div>
</div>
<div class="form-row">
<div class="form-group"><label class="required">Differential Fee</label><input min="0" name="differentialFee" required="" step="0.01" th:value="${fee.differentialFee}" type="number"/></div>
<div class="form-group"><label class="required">Late Penalty</label><input min="0" name="latePenalty" required="" step="0.01" th:value="${fee.latePenalty}" type="number"/></div>
</div>
<div class="form-group">
<label><input name="active" th:checked="${fee.active}" type="checkbox" value="true"/> Set as active structure</label>
</div>
<button class="btn btn-primary" type="submit">Save Structure</button>
</form>
</section>
</main>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
