<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error - Northbridge Institute</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Something Went Wrong</h1>
        <p class="subtitle">Northbridge Institute of Technology Student Portal</p>
        <p>
            Status:
            <strong th:text="${status}">500</strong>
        </p>
        <p>
            Error:
            <strong th:text="${error}">Internal Server Error</strong>
        </p>
        <p class="msg error" th:if="${message}" th:text="${message}">Unexpected error.</p>
        <p class="msg error" th:if="${message == null or #strings.isEmpty(message)}">Unexpected server error.</p>
        <div class="form-actions" style="margin-top: 1rem;">
            <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
            <a th:href="@{/auth/login}" class="btn btn-outline" style="margin-left: 0.5rem;">Go to Login</a>
        </div>
    </div>
</div>
</body>
</html>
