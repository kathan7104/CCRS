<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Forgot Password - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<h1>Forgot Password</h1>
<p class="subtitle">Enter your email to receive an OTP and reset your password.</p>
<p class="msg success" th:if="${success}" th:text="${success}"></p>
<p class="msg error" th:if="${error}" th:text="${error}"></p>
<p class="msg dev-otp" th:if="${devOtpEmail}">Email OTP (for testing): <strong th:text="${devOtpEmail}"></strong></p>
<form class="auth-form" method="post" th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}">
<input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
<div class="form-group">
<label class="required" for="email">Email</label>
<input id="email" placeholder="your@email.com" required="" th:field="*{email}" type="email"/>
<span class="field-error" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
</div>
<div class="form-actions">
<button class="btn btn-primary" type="submit">Send OTP</button>
</div>
<div class="auth-links">
<a th:href="@{/auth/login}">Back to login</a>
</div>
</form>
<div class="auth-links" th:if="${resetEmail}">
<a th:href="@{/auth/reset-password(email=${resetEmail})}">Continue to reset password</a>
</div>
</div>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
