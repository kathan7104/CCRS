<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Verify OTP - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<h1 th:text="${otpType == 'EMAIL' ? 'Verify Email' : (otpType == 'MOBILE' ? 'Verify Mobile' : 'Verify OTP')}">Verify OTP</h1>
<p class="subtitle" th:if="${otpType == 'EMAIL'}">Enter the 6-digit OTP sent to your email.</p>
<p class="subtitle" th:if="${otpType == 'MOBILE'}">Enter the 6-digit OTP sent to your mobile.</p>
<p class="subtitle" th:if="${otpType != 'EMAIL' and otpType != 'MOBILE'}">Enter the 6-digit OTP.</p>
<p class="msg success" th:if="${success}" th:text="${success}"></p>
<p class="msg error" th:if="${error}" th:text="${error}"></p>
<form class="auth-form" method="post" th:action="@{/auth/verify-otp}" th:object="${verifyOtpRequest}">
<input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
<input th:field="*{identifier}" type="hidden"/>
<input th:field="*{otpType}" type="hidden"/>
<div class="form-group">
<label for="identifierDisplay" th:text="${otpType == 'EMAIL' ? 'Email' : (otpType == 'MOBILE' ? 'Mobile' : 'Identifier')}">Identifier</label>
<input class="readonly" id="identifierDisplay" readonly="" th:value="${identifier}" type="text"/>
</div>
<div class="form-group">
<label class="required" for="otp">OTP (6 digits)</label>
<input autocomplete="one-time-code" id="otp" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required="" th:field="*{otp}" type="text"/>
<span class="field-error" th:errors="*{otp}" th:if="${#fields.hasErrors('otp')}"></span>
</div>
<div class="form-actions">
<button class="btn btn-primary" type="submit">Verify</button>
</div>
<div class="auth-links">
<a th:href="@{/auth/login}">Back to login</a>
</div>
</form>
</div>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
