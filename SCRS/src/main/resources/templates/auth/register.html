<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Register - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card auth-card-wide">
<h1>Create Account</h1>
<p class="subtitle">Register with email and mobile for OTP verification</p>
<p class="msg error" th:if="${error}" th:text="${error}"></p>
<form class="auth-form" method="post" th:action="@{/auth/register}" th:object="${registerRequest}">
<input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
<div class="form-row">
<div class="form-group">
<label class="required" for="fullName">Full Name</label>
<input id="fullName" placeholder="Your full name" required="" th:field="*{fullName}" type="text"/>
<span class="field-error" th:errors="*{fullName}" th:if="${#fields.hasErrors('fullName')}"></span>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="required" for="email">Email</label>
<input id="email" placeholder="your@email.com" required="" th:field="*{email}" type="email"/>
<span class="field-error" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
</div>
<div class="form-group">
<label class="required" for="mobileNumber">Mobile (10 digits)</label>
<input id="mobileNumber" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="9876543210" required="" th:field="*{mobileNumber}" type="text"/>
<span class="field-error" th:errors="*{mobileNumber}" th:if="${#fields.hasErrors('mobileNumber')}"></span>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="required" for="password">Password</label>
<input id="password" placeholder="Min 8 chars, upper, lower, digit" required="" th:field="*{password}" title="Password must be at least 8 characters and include an uppercase letter, a lowercase letter, and a number." type="password"/>
<span class="field-error" th:errors="*{password}" th:if="${#fields.hasErrors('password')}"></span>
</div>
<div class="form-group">
<label class="required" for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" placeholder="Repeat password" required="" th:field="*{confirmPassword}" type="password"/>
<span class="field-error" th:errors="*{confirmPassword}" th:if="${#fields.hasErrors('confirmPassword')}"></span>
</div>
</div>
<div class="form-actions">
<button class="btn btn-primary" type="submit">Register</button>
</div>
<div class="auth-links">
<a th:href="@{/auth/login}">Already have an account? Sign in</a>
</div>
</form>
</div>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
