<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Reset Password - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card">
<h1>Reset Password</h1>
<p class="subtitle">Enter the OTP from your email and choose a new password.</p>
<p class="msg success" th:if="${success}" th:text="${success}"></p>
<p class="msg error" th:if="${error}" th:text="${error}"></p>
<p class="msg dev-otp" th:if="${devOtpEmail}">Email OTP (for testing): <strong th:text="${devOtpEmail}"></strong></p>
<form class="auth-form" method="post" th:action="@{/auth/reset-password}" th:object="${resetPasswordRequest}">
<input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
<input th:field="*{email}" type="hidden"/>
<div class="form-group">
<label>Email</label>
<input class="readonly" readonly="" th:value="${email}" type="text"/>
</div>
<div class="form-group">
<label class="required" for="otp">OTP (6 digits)</label>
<input id="otp" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required="" th:field="*{otp}" type="text"/>
<span class="field-error" th:errors="*{otp}" th:if="${#fields.hasErrors('otp')}"></span>
</div>
<div class="form-group">
<label class="required" for="newPassword">New Password</label>
<input id="newPassword" placeholder="Min 8 chars, upper, lower, digit" required="" th:field="*{newPassword}" type="password"/>
<span class="field-error" th:errors="*{newPassword}" th:if="${#fields.hasErrors('newPassword')}"></span>
</div>
<div class="form-group">
<label class="required" for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" placeholder="Repeat password" required="" th:field="*{confirmPassword}" type="password"/>
<span class="field-error" th:errors="*{confirmPassword}" th:if="${#fields.hasErrors('confirmPassword')}"></span>
</div>
<div class="form-actions">
<button class="btn btn-primary" type="submit">Reset Password</button>
</div>
<div class="auth-links">
<a th:href="@{/auth/login}">Back to login</a>
</div>
</form>
</div>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
