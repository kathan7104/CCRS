<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin Dashboard - KOR Institute</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body class="role-admin">
<div class="dashboard-layout">
    <aside class="dashboard-sidebar">
        <div class="sidebar-header">
            <h1>Admin Control Center</h1>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}" class="nav-link active">Dashboard</a>
            <a th:href="@{/admin/enrollments}" class="nav-link">Enrollment Approval</a>
            <a th:href="@{/admin/users}" class="nav-link">Super Users</a>
            <a th:href="@{/admin/departments}" class="nav-link">Departments</a>
            <a th:href="@{/admin/reports}" class="nav-link">Financial Oversight</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <span th:text="${userName}">Admin</span>
                <form th:action="@{/auth/logout}" method="post"><button class="btn btn-outline btn-sm" type="submit">Logout</button></form>
            </div>
        </div>
    </aside>
    <main class="dashboard-main">
        <header class="dashboard-header">
            <h2>Admin Snapshot</h2>
        </header>
        <section class="dashboard-section">
            <div class="metric-grid">
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff6384, #ff9f40); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">⏳</div>
                        <div>
                            <span class="metric-label">Pending Approvals</span>
                            <span class="metric-value" th:text="${pendingApprovals}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #36a2eb, #4bc0c0); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">👥</div>
                        <div>
                            <span class="metric-label">Managed Super Users</span>
                            <span class="metric-value" th:text="${superUsers}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ffcd56, #ff9f40); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">💰</div>
                        <div>
                            <span class="metric-label">Total Revenue</span>
                            <span class="metric-value" th:text="${snapshot.totalRevenue}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff6384, #c45850); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">📄</div>
                        <div>
                            <span class="metric-label">Unpaid Invoices</span>
                            <span class="metric-value" th:text="${snapshot.unpaidCount}">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
