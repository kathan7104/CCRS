<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Director Dashboard - KOR Institute</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body class="role-director">
<header class="dashboard-header">
    <h1>KOR Institute of Technology Director Portal</h1>
    <nav class="dashboard-nav">
        <a th:href="@{/director/dashboard}" class="nav-link active">Dashboard</a>
        <a th:href="@{/director/courses}" class="nav-link">Courses</a>
        <a th:href="@{/director/users}" class="nav-link">Faculty/Students</a>
        <a th:href="@{/director/assignments}" class="nav-link">Assignments</a>
    </nav>
    <div class="user-info">
        <span style="margin-right: 1rem;">Welcome, <span th:text="${userName}">Director</span></span>
        <form th:action="@{/auth/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-outline btn-sm">Logout</button>
        </form>
    </div>
</header>
<div class="dashboard-layout">
    <main class="dashboard-main">
        <header class="dashboard-header">
            <h2 th:text="${department + ' Department Overview'}">Department Overview</h2>
        </header>
        <section class="dashboard-section">
            <div class="metric-grid">
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff6384, #ff9f40); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">📚</div>
                        <div>
                            <span class="metric-label">Department Courses</span>
                            <span class="metric-value" th:text="${courseCount}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #36a2eb, #4bc0c0); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">👨‍🎓</div>
                        <div>
                            <span class="metric-label">Students</span>
                            <span class="metric-value" th:text="${studentCount}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ffcd56, #ff9f40); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">👨‍🏫</div>
                        <div>
                            <span class="metric-label">Faculty</span>
                            <span class="metric-value" th:text="${facultyCount}">0</span>
                        </div>
                    </div>
                </div>
                <div class="metric-card">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff6384, #c45850); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px;">📋</div>
                        <div>
                            <span class="metric-label">Course Assignments</span>
                            <span class="metric-value" th:text="${assignmentCount}">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
