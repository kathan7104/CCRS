<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Department Users - KOR Institute</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"/>
</head>
<body class="role-director">
<header class="dashboard-header">
    <h1 th:text="${department + ' Users'}">Department Users</h1>
    <nav class="dashboard-nav">
        <a th:href="@{/director/dashboard}" class="nav-link">Dashboard</a>
        <a th:href="@{/director/courses}" class="nav-link">Courses</a>
        <a th:href="@{/director/users}" class="nav-link active">Faculty/Students</a>
        <a th:href="@{/director/assignments}" class="nav-link">Assignments</a>
    </nav>
</header>
<div class="dashboard-layout">
    <main class="dashboard-main">
        <section class="dashboard-section">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <h2>Faculty and Students</h2>
                <a th:href="@{/director/users/new}" class="btn btn-primary">Add Faculty</a>
            </div>
            <div th:if="${successMessage}" class="msg success" th:text="${successMessage}">Success</div>
            <div th:if="${errorMessage}" class="msg error" th:text="${errorMessage}">Error</div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Department</th><th>Enrolled Course</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody>
                    <tr th:each="row : ${userRows}">
                        <td th:text="${row.user.fullName}">Name</td>
                        <td th:text="${row.user.email}">Email</td>
                        <td th:text="${row.user.mobileNumber}">Mobile</td>
                        <td th:text="${#strings.listJoin(row.user.roles, ', ')}">Role</td>
                        <td th:text="${row.enrolledDepartment != null ? row.enrolledDepartment : row.user.department}">Department</td>
                        <td th:text="${row.enrolledCourse != null ? row.enrolledCourse : '-'}">BCA101 - Intro</td>
                        <td th:text="${row.user.active ? 'Active' : 'Inactive'}">Active</td>
                        <td>
                            <a th:href="@{/director/users/{id}/edit(id=${row.user.id})}" class="btn btn-sm btn-secondary">Edit</a>
                            <form th:if="${row.user.active}" th:action="@{/director/users/{id}/deactivate(id=${row.user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-sm btn-outline">Deactivate</button>
                            </form>
                            <form th:if="${!row.user.active}" th:action="@{/director/users/{id}/activate(id=${row.user.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-sm btn-primary">Activate</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(userRows)}">
                        <td colspan="8" style="text-align: center; color: #64748b;">No users available.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
