<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Department User Form - KOR Institute</title>
<link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="role-director">
<header class="dashboard-header">
<h1>Department User Form</h1>
<nav class="dashboard-nav"><a class="nav-link active" th:href="@{/director/users}">Back</a></nav>
</header>
<div class="dashboard-layout">
<main class="dashboard-main">
<section class="dashboard-section">
<form method="post" th:action="${user.id == null} ? @{/director/users} : @{/director/users/{id}(id=${user.id})}">
<div class="form-row">
<div class="form-group"><label class="required">Name</label><input name="fullName" required="" th:value="${user.fullName}" type="text"/></div>
<div class="form-group"><label class="required">Email</label><input name="email" required="" th:value="${user.email}" type="email"/></div>
</div>
<div class="form-row">
<div class="form-group"><label class="required">Mobile</label><input name="mobileNumber" required="" th:value="${user.mobileNumber}" type="text"/></div>
<div class="form-group">
<label class="required">Role</label>
<select name="role" required="" th:if="${user.id == null}">
<option selected="" value="AUTHORITY_FACULTY">Faculty</option>
</select>
<input class="readonly" readonly="" th:if="${user.id != null}" th:value="${selectedRole}" type="text"/>
<input name="role" th:if="${user.id != null}" th:value="${selectedRole}" type="hidden"/>
</div>
</div>
<div class="form-group" th:if="${selectedRole == 'AUTHORITY_FACULTY' || user.id == null}">
<label class="required">Department</label>
<select name="department" required="">
<option value="">Select department</option>
<option th:each="d : ${departments}" th:selected="${user.department == d}" th:text="${d}" th:value="${d}"></option>
</select>
</div>
<div class="form-group">
<label th:text="${user.id == null ? 'Password' : 'New Password (optional)'}">Password</label>
<input name="password" th:required="${user.id == null}" type="password"/>
</div>
<button class="btn btn-primary" type="submit">Save</button>
</form>
</section>
</main>
</div>
    <script src="/js/form-validation.js" defer></script>
</body>
</html>
