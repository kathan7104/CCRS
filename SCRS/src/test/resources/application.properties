# Test overrides
# Whether to create seed authority users on startup.
ccrs.dev.create-authority=false
# Whether to seed demo faculty data in dev.
ccrs.dev.seed-demo-faculty=false

# Upload limits (required by UploadConfigLogging)
# Max allowed size for a single uploaded file.
spring.servlet.multipart.max-file-size=-1
# Max allowed size for a full multipart request.
spring.servlet.multipart.max-request-size=-1
# Max size for form POST data handled by Tomcat.
server.tomcat.max-http-form-post-size=-1
# Max size Tomcat will swallow for large requests.
server.tomcat.max-swallow-size=-1
# Max number of parts in a multipart request.
server.tomcat.max-part-count=-1
# Max number of request parameters allowed.
server.tomcat.max-parameter-count=-1
